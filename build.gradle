plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'ploceus' version '1.17-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
}

base {
	archivesName = project.archives_base_name
}
version = "${project.version}"
group = project.maven_group

ploceus {
	setIntermediaryGeneration(2)
}

repositories {
	mavenCentral()
	google()

	maven { url = "https://redirector.kotlinlang.org/maven/compose-dev" }
	maven { url = "https://maven.cloverclient.com/releases" }
	maven { url = "https://repo.papermc.io/repository/maven-public/" }
	maven { url = "https://repo.polyfrost.org/releases" }
	maven { url = "https://repo.polyfrost.org/snapshots" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

	modImplementation("pl.tomgirl:pylon:${project.pylon_version}")
	modImplementation("org.polyfrost.oneconfig:1.8.9-ornithe:${project.oneconfig_version}")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {

    withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
kotlin {
    jvmToolchain(25)
}
